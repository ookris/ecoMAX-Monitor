<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecoMAX Monitor - Logi</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}">
    <script>
        // Zastosuj motyw przed renderowaniem (zapobiega miganiu)
        (function () { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); })();
    </script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
    <header>
        <h1><a href="/" class="brand-link"><img src="/static/img/logo.svg?v={{ asset_version }}" alt="" class="brand-logo">ecoMAX Monitor - Logi</a></h1>
        <div class="header-actions">
            <button id="btn-theme" class="btn-theme" onclick="toggleTheme()" title="Przełącz na tryb ciemny"><iconify-icon icon="mdi:weather-night"></iconify-icon></button>
            {% set active_page = 'logs' %}
            {% include '_menu_dropdown.html' %}
        </div>
    </header>

    <main>
        <div id="logs-msg" class="settings-msg" style="display:none"></div>

        <!-- Kontrolki -->
        <section class="logs-controls">
            <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label for="logsLines" style="font-size: 0.9rem;">Liczba linii:</label>
                    <input type="number" id="logsLines" min="10" max="1000" value="200" style="width: 80px;">
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label for="logsLevel" style="font-size: 0.9rem;">Poziom:</label>
                    <select id="logsLevel" style="padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary);">
                        <option value="ALL">Wszystkie</option>
                        <option value="DEBUG">DEBUG</option>
                        <option value="INFO">INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>
                </div>
                <button class="btn-secondary" onclick="loadLogs()">Odśwież</button>
                <button class="btn-secondary" onclick="downloadLogsFile()">Pobierz plik</button>
                <button class="btn-secondary" onclick="clearLogsView()">Wyczyść widok</button>
                <button class="btn-secondary" onclick="scrollToTop()">⬆ Do góry</button>
            </div>
        </section>

        <!-- Wyświetlacze logów -->
        <section class="logs-section">
            <div class="logs-table-head">
                <span>Czas</span>
                <span>Poziom</span>
                <span>Moduł</span>
                <span>Treść</span>
            </div>
            <div id="logsContent" class="logs-content"></div>
        </section>

        <!-- Statystyka -->
        <section class="logs-stats" style="display:none;">
            <p id="logsStats"></p>
        </section>
    </main>

    <footer>
        <span>ecoMAX Monitor | <a href="/">Dashboard</a> | <a href="/settings">Ustawienia</a></span>
    </footer>

    <script src="/static/js/logs.js?v={{ asset_version }}"></script>
    <script src="/static/js/nav.js?v={{ asset_version }}"></script>
    <script src="/static/js/theme.js?v={{ asset_version }}"></script>
</body>
</html>
